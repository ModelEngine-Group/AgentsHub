<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>糖尿病症状分布</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>body{margin:20px;font-family:sans-serif}.chart{width:100%;height:500px}</style>
</head>
<body>
<h2>糖尿病症状分布</h2>
<div id="chart" class="chart"></div>
<script>
var chart=echarts.init(document.getElementById('chart'));
chart.setOption({
    tooltip:{trigger:'axis'},
    xAxis:{type:'category',data:['多饮多尿','视力模糊','体重减轻','疲劳乏力','伤口愈合慢']},
    yAxis:{type:'value'},
    series:[{type:'bar',data:[12,6,5,3,2],itemStyle:{color:'#378ADD'}}]
});
window.addEventListener('resize',function(){chart.resize()});
</script>
</body>
</html>
