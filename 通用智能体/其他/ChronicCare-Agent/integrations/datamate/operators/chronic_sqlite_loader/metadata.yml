name: chronic_sqlite_loader
raw_id: chronic_sqlite_loader
display_name: 慢病分析 SQLite 装载算子
version: 0.1.0
type: data_processing
domain: healthcare_chronic_followup
language: python
description: 将归一化后的结构化表加载到本地 SQLite，为 NL2SQL 和指标分析提供查询基座。
inputs:
  - name: normalized_tables
    type: directory
    required: true
outputs:
  - name: sqlite_db
    type: sqlite
  - name: sqlite_loader_report
    type: json
parameters:
  - name: export_path
    type: string
    default: ./outputs
dependencies:
  - python>=3.10
entrypoint: process.py
tags: [ChronicCare, DataMate, healthcare, sqlite]
safety_note: 本项目仅用于慢病随访数据处理、知识组织和辅助分析，不提供临床诊断，不替代医生决策。
