name: chronic_file_ingest
raw_id: chronic_file_ingest
display_name: 慢病随访原始数据接入算子
version: 0.1.0
type: data_processing
domain: healthcare_chronic_followup
language: python
description: 扫描慢病随访原始结构化与文本数据，生成后续处理链路使用的 manifest。
inputs:
  - name: raw_structured
    type: directory
    required: true
