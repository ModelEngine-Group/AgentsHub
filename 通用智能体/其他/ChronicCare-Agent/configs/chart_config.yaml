chart_defaults:
  width: 900
  height: 520
  template: plotly_white
  output_format: html

chart_type_mapping:
  metric_card:
    renderer: metric_card
  bar:
    renderer: bar
  line:
    renderer: line
  table:
    renderer: table

report_sections:
