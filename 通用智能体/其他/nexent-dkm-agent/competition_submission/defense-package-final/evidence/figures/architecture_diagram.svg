<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430"><rect width="100%" height="100%" fill="#fbfdff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs><text x="24" y="34" font-size="22" font-weight="700">DKM Agent Architecture</text><text x="24" y="56" font-size="13" fill="#475569">Demo 入口 → Agent 规划 → Operator 执行 → Pipeline 编排；底部为各层外部集成与验证</text><rect x="40" y="72" width="180" height="88" rx="12" fill="#e8f1ff" stroke="#94a3b8"/><text x="130.0" y="121.0" text-anchor="middle" font-size="14" font-weight="600">Demo / API</text><rect x="250" y="72" width="180" height="88" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="340.0" y="121.0" text-anchor="middle" font-size="14" font-weight="600">Agent 层</text><rect x="460" y="72" width="180" height="88" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="550.0" y="121.0" text-anchor="middle" font-size="14" font-weight="600">Operator 层</text><rect x="670" y="72" width="180" height="88" rx="12" fill="#fef3c7" stroke="#94a3b8"/><text x="760.0" y="121.0" text-anchor="middle" font-size="14" font-weight="600">Pipeline 层</text><rect x="40" y="228" width="180" height="88" rx="12" fill="#f8fafc" stroke="#94a3b8"/><text x="130.0" y="262.0" text-anchor="middle" font-size="13" font-weight="600">CLI · REST</text><text x="130.0" y="282.0" text-anchor="middle" font-size="12" fill="#475569">入口</text><rect x="250" y="228" width="180" height="88" rx="12" fill="#ede9fe" stroke="#94a3b8"/><text x="340.0" y="262.0" text-anchor="middle" font-size="13" font-weight="600">Nexent Adapter</text><text x="340.0" y="282.0" text-anchor="middle" font-size="12" fill="#475569">Agent Spec</text><rect x="460" y="228" width="180" height="88" rx="12" fill="#ffe4e6" stroke="#94a3b8"/><text x="550.0" y="262.0" text-anchor="middle" font-size="13" font-weight="600">DataMate · Neo4j</text><text x="550.0" y="282.0" text-anchor="middle" font-size="12" fill="#475569">LLM 可选增强</text><rect x="670" y="228" width="180" height="88" rx="12" fill="#f1f5f9" stroke="#94a3b8"/><text x="760.0" y="262.0" text-anchor="middle" font-size="13" font-weight="600">Benchmark / pytest</text><text x="760.0" y="282.0" text-anchor="middle" font-size="12" fill="#475569">End-to-End</text><line x1="130.0" y1="160.0" x2="130.0" y2="228" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="340.0" y1="160.0" x2="340.0" y2="228" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="550.0" y1="160.0" x2="550.0" y2="228" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="760.0" y1="160.0" x2="760.0" y2="228" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="220.0" y1="116.0" x2="250.0" y2="116.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="430.0" y1="116.0" x2="460.0" y2="116.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="640.0" y1="116.0" x2="670.0" y2="116.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="360" font-size="13" fill="#334155">业务闭环：Task1 数据清洗 → Task2 医疗 KG → Task3 NL2SQL / BI 洞察</text><text x="24" y="382" font-size="12" fill="#64748b">跨任务串联由 Pipeline 层 end_to_end_pipeline 与 DKMOrchestrator 负责，Agent 之间不直接耦合</text></svg>